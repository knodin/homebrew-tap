name: Audit formula

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify release metadata
        run: scripts/verify-knodin-formula

      - name: Check maintenance script syntax
        run: |
          bash -n scripts/verify-knodin-formula
          bash -n scripts/update-knodin-formula

  homebrew:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify release metadata
        run: scripts/verify-knodin-formula

      - name: Register checked-out tap
        run: brew tap knodin/tap "$GITHUB_WORKSPACE"

      - name: Style and audit formula
        run: |
          brew style Formula/knodin.rb
          brew audit --strict knodin/tap/knodin

      - name: Install and test formula
        run: |
          brew install --build-from-source knodin/tap/knodin
          brew test knodin/tap/knodin
